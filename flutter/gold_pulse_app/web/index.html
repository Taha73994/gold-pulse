<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="نبض الذهب — أسعار الذهب اللحظية، التحليل، التوقعات، محلات الذهب والعملات للمستثمر العراقي. Gold Pulse — live gold prices, analysis, forecasts and shops for Iraqi investors.">
  <meta name="theme-color" content="#0B0D12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="نبض الذهب">
  <meta property="og:title" content="نبض الذهب — Gold Pulse">
  <meta property="og:description" content="أسعار الذهب اللحظية وتحليل ذكي للمستثمر العراقي.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:type" content="website">

  <title>نبض الذهب — Gold Pulse</title>

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0B0D12;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 35%, #1C160C 0%, #0B0D12 70%);
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: #E9C46A;
      transition: opacity .45s ease;
      z-index: 9999;
    }
    #splash img {
      width: 116px;
      height: 116px;
      border-radius: 26px;
      box-shadow: 0 16px 40px rgba(217, 172, 69, .28);
      animation: float 2.4s ease-in-out infinite;
    }
    #splash .name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .5px;
    }
    #splash .sub {
      font-size: 12px;
      color: #8B8F9A;
      margin-top: -10px;
    }
    #splash .bar {
      width: 148px;
      height: 3px;
      border-radius: 3px;
      overflow: hidden;
      background: rgba(233, 196, 106, .16);
    }
    #splash .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #C99F2F, #F6E7B4, #C99F2F);
      animation: slide 1.3s linear infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Gold Pulse">
    <div class="name">نبض الذهب</div>
    <div class="sub">Gold Pulse · أسعار لحظية وتحليل ذكي</div>
    <div class="bar"><span></span></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
