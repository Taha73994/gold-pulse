services:
  - type: web
    name: gold-pulse-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GOLD_ADMIN_PIN
        sync: false
      - key: GOLD_PRICE_ALERT_PCT
        value: "0.9"
      - key: GOLD_PRICE_ALERT_MINUTES
        value: "45"
      - key: GOLD_DEFAULT_USD_IQD
        value: "1517"
      - key: PYTHONUNBUFFERED
        value: "1"
